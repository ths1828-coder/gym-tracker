<style>
/* ── Reset & Base ───────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: #0a0a0a; }
body {
  font-family: -apple-system, 'Noto Sans JP', sans-serif;
  color: #f4f0e8;
  /* Safe area for iPhone notch/home indicator */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── Typography ─────────────────────────────────── */
.bebas { font-family: 'Bebas Neue', -apple-system, sans-serif; letter-spacing: 2px; }
.mono  { font-family: 'SF Mono', 'Courier New', monospace; }

/* ── Layout shell ───────────────────────────────── */
#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
}

/* ── Scrollable content ─────────────────────────── */
.scroll-area {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 14px 15px calc(80px + env(safe-area-inset-bottom));
}

/* ── Bottom nav ─────────────────────────────────── */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(12,12,12,.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid #1e1e1e;
  display: flex;
  z-index: 100;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 0; border: none; background: none; cursor: pointer;
  transition: opacity .15s;
  -webkit-user-select: none; user-select: none;
}
.nav-btn:active { opacity: .6; }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; }

/* ── Phase pills ────────────────────────────────── */
.phase-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin: 10px 0; }
.phase-pill {
  border-radius: 10px; padding: 9px 4px; text-align: center;
  border: 1px solid; cursor: pointer; transition: all .2s;
  -webkit-user-select: none; user-select: none;
}
.phase-pill:active { transform: scale(.96); }

/* ── Day cards ──────────────────────────────────── */
.day-card {
  border-radius: 14px; overflow: hidden;
  border: 1px solid #1e1e1e; margin-bottom: 10px;
  transition: box-shadow .3s;
  background: #111;
}
.day-card.is-today { box-shadow: 0 0 24px var(--day-color, #3ddc84)18; }
.day-header {
  display: flex; align-items: center; gap: 12; padding: 14px 16px; cursor: pointer;
  -webkit-user-select: none; user-select: none;
}
.day-header:active { background: rgba(255,255,255,.03); }
.day-body { border-top: 1px solid #1a1a1a; padding: 10px 12px 12px; }

/* ── Task items ─────────────────────────────────── */
.task-item {
  border-radius: 10px; margin-bottom: 8px; overflow: hidden;
  border: 1px solid #252525; background: #161616;
  transition: border-color .25s, background .25s;
}
.task-item.done { background: rgba(var(--task-rgb,61,220,132),.05); }
.task-row {
  display: flex; align-items: center; gap: 10; padding: 12px 12px;
  cursor: pointer; -webkit-user-select: none; user-select: none;
}
.task-row:active { background: rgba(255,255,255,.03); }
.checkbox {
  width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
  border: 2px solid #3a3a3a; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; color: #000;
  transition: all .2s; flex-shrink: 0;
}
.task-label { font-size: 13.5px; font-weight: 600; color: #eee; line-height: 1.35; }
.task-label.done { text-decoration: line-through; color: #555; font-weight: 400; }
.task-time { font-size: 11px; color: #555; margin-top: 2px; }
.task-badge {
  font-size: 10px; font-family: monospace; padding: 2px 8px;
  border-radius: 99px; white-space: nowrap;
}

/* ── Log sheet ──────────────────────────────────── */
.sheet-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: flex-end;
  animation: fadeIn .2s ease;
}
.sheet {
  width: 100%; background: #161616;
  border-radius: 20px 20px 0 0;
  border: 1px solid #2a2a2a; border-bottom: none;
  padding: 0 18px calc(20px + env(safe-area-inset-bottom));
  max-height: 88vh; overflow-y: auto;
  animation: slideUp .3s cubic-bezier(.16,1,.3,1);
}
.sheet-handle {
  width: 36px; height: 4px; background: #333; border-radius: 99px;
  margin: 12px auto 16px;
}
.set-row { display: grid; grid-template-columns: 28px 1fr 1fr 44px; gap: 8px; align-items: center; margin-bottom: 8px; }
.set-input {
  background: #1e1e1e; border: 1.5px solid #2a2a2a; border-radius: 10px;
  padding: 12px; color: #eee; font-size: 16px; font-family: monospace;

  transition: border-color .2s;

.set-input:focus { border-color: var(--accent, #3ddc84); }
.set-done-btn {
  width: 44px; height: 44px; border-radius: 10px;
  border: 2px solid #333; background: transparent;
  font-size: 16px; cursor: pointer; transition: all .2s;

.save-btn {
  width: 100%; padding: 15px; border: none; border-radius: 14px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  letter-spacing: .5px; margin-top: 8px;
  -webkit-user-select: none; user-select: none;
  transition: transform .1s, opacity .15s;
}
.save-btn:active { transform: scale(.97); opacity: .9; }

/* ── Stat cards ─────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat-card {
  background: #111; border: 1px solid #1e1e1e; border-radius: 12px;
  padding: 12px 8px; text-align: center;
}
.stat-val { font-size: 22px; line-height: 1; }
.stat-lbl { font-size: 9px; color: #555; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

/* ── Progress bar ───────────────────────────────── */
.pbar-track { height: 6px; background: #1a1a1a; border-radius: 99px; overflow: hidden; }
.pbar-fill  { height: 100%; border-radius: 99px; transition: width .7s cubic-bezier(.16,1,.3,1); }

/* ── Log history ────────────────────────────────── */
.log-card {
  background: #111; border: 1px solid #1e1e1e; border-radius: 14px;
  padding: 14px; margin-bottom: 10px;
}
.set-chip {
  display: inline-flex; align-items: center;
  background: #1a1a1a; border-radius: 8px;
  padding: 5px 10px; font-size: 11px; font-family: monospace;
  border: 1px solid #252525; margin: 3px;
}

/* ── Hero today card ────────────────────────────── */
.today-hero {
  border-radius: 16px; padding: 18px 16px; margin-bottom: 14px;
  border: 1px solid;
}
.today-circle {
  width: 60px; height: 60px; border-radius: 50%; border: 3px solid;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ── Info banner ────────────────────────────────── */
.info-banner {
  border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  border: 1px solid;
}

/* ── Confetti ───────────────────────────────────── */
.confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
.confetti-piece { position: absolute; top: -16px; border-radius: 2px; }

/* ── Empty state ────────────────────────────────── */
.empty { text-align: center; padding: 60px 20px; }

/* ── Animations ─────────────────────────────────── */
@keyframes fadeIn   { from { opacity:0 } to { opacity:1 } }
@keyframes slideUp  { from { transform: translateY(60px); opacity:0 } to { transform:none; opacity:1 } }
@keyframes cfFall   {
  0%   { transform: translateY(-20px) rotate(0deg); opacity:1 }
  100% { transform: translateY(110vh) rotate(720deg); opacity:0 }
}

/* ── Scrollbar ──────────────────────────────────── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

/* ── Textarea ───────────────────────────────────── */
textarea {
  width: 100%; background: #1e1e1e; border: 1.5px solid #2a2a2a;
  border-radius: 10px; padding: 12px; color: #ccc; font-size: 14px;
  font-family: -apple-system, sans-serif; resize: none; outline: none;
  line-height: 1.6; -webkit-appearance: none;
  transition: border-color .2s;
}
textarea:focus { border-color: #3ddc84; }
</style>

function getWeekKey(){
  const now=new Date();
  const d=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const wk=Math.ceil((((d-ys)/86400000)+1)/7);
  return `${d.getUTCFullYear()}-W${String(wk).padStart(2,"0")}`;
}

// Auto-detect current phase from today's date
function detectPhase(){
  const today = new Date();
  const toStr = d => d.toISOString().slice(0,10);
  const ts = toStr(today);
  for(const ph of PHASES){
    if(ts >= ph.startDate && ts <= ph.endDate) return ph.id;
  }
  if(ts < PHASES[0].startDate) return 1;
  return 4;
}

// Build week-slot calendar for a phase (Mon〜Sun blocks)
function buildPhaseCalendar(ph){
  const start = new Date(ph.startDate+"T00:00:00");
  const end   = new Date(ph.endDate+"T00:00:00");
  const weeks = [];
  let cur = new Date(start);
  // align to Monday
  const dow = cur.getDay(); // 0=Sun
  const diff = dow===0 ? 0 : (1 - dow + 7) % 7; // days to next Mon (0 if already Mon)
  // actually start is always Mon in our data, but keep safe:
  let weekStart = new Date(cur);
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay()+6)%7)); // floor to Mon
  while(weekStart <= end){
    const days = [];
    for(let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
      days.push(d <= end && d >= start ? d : null);
    }
    weeks.push({weekStart:new Date(weekStart), days});
    weekStart.setDate(weekStart.getDate()+7);
  }
  return weeks;
}

// ── HELPERS ────────────────────────────────────────────────────────
function ck(taskId){ return `${state.phase}:${state.weekKey}:${taskId}`; }
function isChecked(taskId){ return !!(state.data.checked||{})[ck(taskId)]; }
function getLog(taskId){ return (state.data.logs||{})[ck(taskId)]; }
function curPhase(){ return PHASES.find(p=>p.id===state.phase); }

function toggle(taskId){
  const key=ck(taskId);
  const checked={...(state.data.checked||{})};
  checked[key]=!checked[key];
  state.data={...state.data,checked};
  saveState();
  // check day complete
  const ph=curPhase();
  const parts=taskId.split("-");
  const dayId=parts.slice(0,2).join("-");
  const day=ph.schedule.find(d=>d.id===dayId);
  if(day && day.tasks.every(t=>checked[ck(t.id)])){
    if(checked[key]) setTimeout(()=>launchConfetti(day.color),80);
  }
  renderMain();
}

function saveLog(taskId,logData){
  const now=new Date();
  const ds=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,"0")}/${String(now.getDate()).padStart(2,"0")}`;
  const logs={...(state.data.logs||{})};
  const task=curPhase().schedule.flatMap(d=>d.tasks).find(t=>t.id===taskId);
  logs[ck(taskId)]={...logData,label:task?.label||"",date:ds,weekKey:state.weekKey,phaseId:state.phase,savedAt:Date.now()};
  state.data={...state.data,logs};
  saveState();
  state.sheet=null;
  renderMain();
  renderSheet();
}

function launchConfetti(color){
  const layer=document.getElementById("confetti-layer");
  layer.innerHTML="";
  const colors=[color,"#f4c542","#e63946","#fff","#c47fff"];
  for(let i=0;i<28;i++){
    const el=document.createElement("div");
    el.className="confetti-piece";
    const c=colors[i%colors.length];
    const size=6+Math.random()*9;
    Object.assign(el.style,{
      left:`${Math.random()*100}%`, width:size+"px", height:size+"px",
      background:c, borderRadius:Math.random()>.5?"50%":"2px",
      animation:`cfFall ${1.2+Math.random()*.9}s ease-in ${Math.random()*.6}s forwards`
    });
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML="",2500);
}

function buildLogs(){
  const logs=state.data.logs||{};
  const entries=Object.entries(logs).filter(([,v])=>v.sets?.some(s=>s.kg||s.reps)).sort((a,b)=>(b[1].savedAt||0)-(a[1].savedAt||0));
  if(!entries.length) return `<div class="empty"><div style="font-size:36px;margin-bottom:12px">📋</div><div style="font-size:14px;color:#555;font-weight:600">記録がまだありません</div><div style="font-size:12px;color:#3a3a3a;margin-top:8px">種目の「＋記録」ボタンから<br>重量・回数を入力してください</div></div>`;

  const byDate={};
  entries.forEach(([id,v])=>{ const d=v.date||"不明"; if(!byDate[d])byDate[d]=[]; byDate[d].push([id,v]); });

  return Object.entries(byDate).map(([date,items])=>{
    const cards=items.map(([id,v])=>{
      const ph=PHASES.find(p=>p.id===v.phaseId);
      const color=ph?.color||"#3ddc84";
      const maxKg=Math.max(...v.sets.filter(s=>s.kg).map(s=>parseFloat(s.kg)||0),0);
      const vol=v.sets.filter(s=>s.kg&&s.reps).reduce((s,r)=>s+(parseFloat(r.kg)||0)*(parseInt(r.reps)||0),0);
      const chips=v.sets.filter(s=>s.kg||s.reps).map((s,i)=>
        `<span class="set-chip" style="color:${s.done?color:"#666"};border-color:${s.done?color+"35":"#252525"}">${i+1}. ${s.kg||"—"}kg×${s.reps||"—"} ${s.done?"✓":""}</span>`
      ).join("");
      const noteEl=v.note?`<div style="font-size:11px;color:#666;margin-top:10px;line-height:1.6;border-top:1px solid #1a1a1a;padding-top:8px">💬 ${v.note}</div>`:"";
      return `

  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
    <div style="flex:1;margin-right:10px">
      <div style="font-size:13px;font-weight:700;color:#ddd;line-height:1.4">${v.label}</div>
      <div style="font-size:10px;color:${color};margin-top:3px;font-family:monospace">${ph?.label||""} — ${v.weekKey||""}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      ${maxKg>0?`<div style="font-family:monospace;font-size:20px;font-weight:700;color:${color};line-height:1">${maxKg}kg</div>`:""}
      ${vol>0?`<div style="font-size:10px;color:#555">総負荷 ${vol.toLocaleString()}kg</div>`:""}
    </div>
  </div>
  <div>${chips}</div>
  ${noteEl}
</div>`;
    }).join("");
    return `<div style="margin-bottom:18px"><div style="font-size:10px;color:#555;letter-spacing:3px;font-family:monospace;margin-bottom:8px;padding-left:2px">${date}</div>${cards}</div>`;
  }).join("");
}

    <div style="display:flex;justify-content:space-between;font-size:10px;color:#555;margin-top:5px;font-family:monospace">
      <span>${days}/7日 完了</span><span>${pct}%</span>
    </div>
  </div>

  <div style="background:#111;border:1px solid #222;border-radius:10px;padding:10px 12px;margin-top:8px">
    <div style="font-size:9px;color:#555;letter-spacing:2px;margin-bottom:5px;font-family:monospace">NEXT PHASE CRITERIA</div>
    <div style="font-size:11px;color:#3ddc84;line-height:1.7">${ph.next}</div>
  </div>
</div>`;
}

// ── BOTTOM NAV ─────────────────────────────────────────────────────
function buildNav(){
  const tabs=[["today","🏠","TODAY"],["week","📅","全曜日"],["logs","📊","ログ"],["cal","🗓","日程"]];
  const ph=curPhase();
  return tabs.map(([k,icon,label])=>`
<button class="nav-btn" onclick="setTab('${k}')">
  <span class="nav-icon">${icon}</span>
  <span class="nav-label" style="color:${state.tab===k?ph.color:"#555"}">${label}</span>
  ${state.tab===k?`<div style="position:absolute;bottom:env(safe-area-inset-bottom);left:50%;transform:translateX(-50%);width:20px;height:2px;background:${ph.color};border-radius:99px"></div>`:""}
</button>`).join("");
}

// ── LOG SHEET ──────────────────────────────────────────────────────
function renderSheet(){
  const layer=document.getElementById("sheet-layer");
  if(!state.sheet){ layer.innerHTML=""; return; }
  const {task,color}=state.sheet;
  const existing=getLog(task.id);
  const sets=existing?.sets||[{kg:"",reps:"",done:false}];
  const note=existing?.note||"";

  // Store sets in a temp global for the sheet
  window._sheetSets=JSON.parse(JSON.stringify(sets));
  window._sheetNote=note;

  layer.innerHTML=`
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div style="font-size:10px;color:${color};letter-spacing:3px;font-family:monospace;margin-bottom:6px">WORKOUT LOG</div>
    <div style="font-size:14px;font-weight:700;color:#eee;margin-bottom:18px;line-height:1.4">${task.label}</div>

    <div style="display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;margin-bottom:8px;font-size:10px;color:#555;letter-spacing:1px;font-family:monospace">
      <span>SET</span><span>重量(kg)</span><span>回数</span><span></span>
    </div>
    <div id="set-rows"></div>

    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button onclick="addSheetSet('${color}')" style="flex:1;padding:10px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:10px;color:#888;font-size:12px;cursor:pointer">＋ セット追加</button>
      <button onclick="removeSheetSet('${color}')" style="padding:10px 14px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:10px;color:#555;font-size:12px;cursor:pointer">削除</button>
    </div>

    <textarea id="sheet-note" rows="2" placeholder="メモ（体調・フォームの気づきなど）">${note}</textarea>

    <button class="save-btn" style="background:${color};color:#000;margin-top:12px" onclick="commitLog('${task.id}','${color}')">💾 保存する</button>
  </div>
</div>`;
  renderSetRows(color);
}

function renderSetRows(color){
  const rows=document.getElementById("set-rows");
  if(!rows) return;
  rows.innerHTML=window._sheetSets.map((s,i)=>`
<div class="set-row">
  <div style="font-family:monospace;font-size:14px;font-weight:700;color:${s.done?color:"#555"};text-align:center">${i+1}</div>
  <input class="set-input" type="number" inputmode="decimal" placeholder="0" value="${s.kg}"
    oninput="updateSet(${i},'kg',this.value,'${color}')"
    style="border-color:${s.done?color+"70":"#2a2a2a"}">
  <input class="set-input" type="number" inputmode="numeric" placeholder="0" value="${s.reps}"
    oninput="updateSet(${i},'reps',this.value,'${color}')"
    style="border-color:${s.done?color+"70":"#2a2a2a"}">
  <button class="set-done-btn" onclick="toggleSetDone(${i},'${color}')"
    style="border-color:${s.done?color:"#333"};background:${s.done?color+"25":"transparent"};color:${s.done?color:"#555"}">
    ${s.done?"✓":"○"}
  </button>
</div>`).join("");
}

window.updateSet=(i,field,val,color)=>{ window._sheetSets[i][field]=val; renderSetRows(color); };
window.toggleSetDone=(i,color)=>{ window._sheetSets[i].done=!window._sheetSets[i].done; renderSetRows(color); };
window.addSheetSet=(color)=>{ const last=window._sheetSets[window._sheetSets.length-1]||{}; window._sheetSets.push({kg:last.kg||"",reps:last.reps||"",done:false}); renderSetRows(color); };
window.removeSheetSet=(color)=>{ if(window._sheetSets.length>1){window._sheetSets.pop();renderSetRows(color);} };
window.commitLog=(taskId,color)=>{
  window._sheetNote=document.getElementById("sheet-note")?.value||"";
  saveLog(taskId,{sets:window._sheetSets,note:window._sheetNote});
};
window.closeSheet=()=>{ state.sheet=null; renderSheet(); };
window.openSheet=(taskId,color)=>{
  const task=curPhase().schedule.flatMap(d=>d.tasks).find(t=>t.id===taskId);
  if(!task) return;
  state.sheet={task,color};
  renderSheet();
};


// ── CALENDAR TAB ───────────────────────────────────────────────────
function buildCal(){
  const DAY_LABELS=["月","火","水","木","金","土","日"];
  const today = new Date(); today.setHours(0,0,0,0);
  const toYMD = d => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;

  // Phase timeline bar
  const timelineHtml = PHASES.map(ph=>{
    const isActive = ph.id === state.phase;
    const isPast   = new Date(ph.endDate+"T23:59:59") < today;
    return `<div onclick="setPhase(${ph.id})" style="flex:1;text-align:center;padding:8px 4px;border-radius:10px;cursor:pointer;
      background:${isActive?ph.color+"22":isPast?"#0f0f0f":"#111"};
      border:1px solid ${isActive?ph.color:isPast?"#1a1a1a":"#252525"};
      transition:all .2s">
      <div style="font-family:monospace;font-size:10px;font-weight:700;color:${isActive?ph.color:isPast?"#333":"#555"}">${ph.label}</div>
      <div style="font-size:8px;color:${isActive?ph.color+"bb":isPast?"#2a2a2a":"#3a3a3a"};margin-top:2px;line-height:1.3">${ph.weeks}</div>
      ${isPast?`<div style="font-size:9px;color:#3a3a3a;margin-top:2px">完了</div>`:""}
      ${isActive?`<div style="font-size:9px;color:${ph.color};margin-top:2px">● NOW</div>`:""}
    </div>`;
  }).join("");

  // Big schedule milestones
  const milestones = [
    {date:"2026-09-07",label:"リハビリ開始",icon:"🏥",color:"#7abfff"},
    {date:"2026-10-05",label:"PHASE 2 開始 / 下肢マシン解禁",icon:"🦵",color:"#f4c542"},
    {date:"2026-11-02",label:"PHASE 3 開始 / 全器具解禁",icon:"🏋️",color:"#ff9f43"},
    {date:"2026-11-02",label:"チーム練習 部分参加開始",icon:"⚽",color:"#c47fff"},
    {date:"2026-12-14",label:"PHASE 4 開始 / チーム練習フル参加",icon:"🔥",color:"#3ddc84"},
    {date:"2027-01-24",label:"神奈川県1部リーグ 完全復帰目標",icon:"🏆",color:"#f4c542"},
  ];

  const msHtml = milestones.map(m=>{
    const mDate = new Date(m.date+"T00:00:00");
    const diff  = Math.round((mDate - today)/(1000*60*60*24));
    const passed = diff < 0;
    const isToday2 = diff === 0;
    let diffLabel="";
    if(isToday2) diffLabel=`<span style="color:${m.color};font-weight:700">TODAY</span>`;
    else if(passed) diffLabel=`<span style="color:#444">${Math.abs(diff)}日前</span>`;
    else diffLabel=`<span style="color:${m.color}">あと${diff}日</span>`;

    return `<div style="display:flex;align-items:center;gap:12px;padding:13px 14px;
      background:${isToday2?m.color+"18":"#111"};
      border:1px solid ${isToday2?m.color+"60":passed?"#1a1a1a":"#1e1e1e"};
      border-radius:12px;margin-bottom:8px;opacity:${passed?.5:1}">
      <div style="font-size:24px;flex-shrink:0">${m.icon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:${isToday2?700:600};color:${passed?"#444":"#ddd"}">${m.label}</div>
        <div style="font-size:11px;color:#555;margin-top:2px;font-family:monospace">${m.date.replace(/-/g,"/")}　${diffLabel}</div>
      </div>
    </div>`;
  }).join("");

  // Weekly calendar for current phase
  const ph = curPhase();
  const cal = buildPhaseCalendar(ph);
  const DAY_MAP_REV = ["sun","mon","tue","wed","thu","fri","sat"];

  const calHtml = cal.map((week,wi)=>{
    const wsLabel = toYMD(week.weekStart);
    const dayBoxes = week.days.map((d,di)=>{
      if(!d){ return `<div style="flex:1;height:52px"></div>`; }
      const isT = d.getTime()===today.getTime();
      const dayKey = DAY_MAP_REV[d.getDay()];
      const dayData = ph.schedule.find(s=>s.id===`p${ph.id}-${dayKey}`);
      const done = dayData ? dayData.tasks.filter(t=>isChecked(t.id)).length : 0;
      const total = dayData ? dayData.tasks.length : 0;
      const pct = total>0 ? Math.round((done/total)*100) : 0;
      const complete = done===total && total>0;
      const dayColor = dayData?.color || ph.color;
      const bs = dayData ? (BS[dayData.type]||BS.recovery) : {c:"#555"};

      return `<div onclick="setTab('week')" style="flex:1;height:52px;border-radius:9px;
        background:${isT?dayColor+"28":complete?dayColor+"14":"#1a1a1a"};
        border:1.5px solid ${isT?dayColor:complete?dayColor+"50":"#252525"};
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
        cursor:pointer;transition:all .2s;position:relative;overflow:hidden">
        <div style="font-size:9px;color:${isT?dayColor:complete?dayColor:"#666"};font-weight:${isT?700:400}">${["日","月","火","水","木","金","土"][d.getDay()]}</div>
        <div style="font-size:12px;font-weight:700;color:${isT?dayColor:complete?dayColor:"#888"}">${d.getDate()}</div>
        ${total>0?`<div style="width:80%;height:2px;background:#1a1a1a;border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${dayColor}"></div></div>`:""}
        ${isT?`<div style="position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:${dayColor}"></div>`:""}
        ${complete?`<div style="position:absolute;bottom:3px;right:4px;font-size:8px;color:${dayColor}">✓</div>`:""}
      </div>`;
    }).join("");

    return `<div style="margin-bottom:10px">
      <div style="font-size:9px;color:#444;letter-spacing:2px;font-family:monospace;margin-bottom:6px">Week ${wi+1} — ${wsLabel}〜</div>
      <div style="display:flex;gap:4px">${dayBoxes}</div>
    </div>`;
  }).join("");

  // days remaining in current phase
  const phEnd = new Date(ph.endDate+"T23:59:59");
  const daysLeft = Math.max(0, Math.ceil((phEnd-today)/(1000*60*60*24)));
  const phStart = new Date(ph.startDate+"T00:00:00");
  const phTotal = Math.ceil((phEnd-phStart)/(1000*60*60*24));
  const phPassed = Math.min(phTotal, phTotal - daysLeft);
  const phPct = Math.round((phPassed/phTotal)*100);

  return `
<div style="margin-bottom:18px">
  <div style="font-size:10px;color:#555;letter-spacing:3px;font-family:monospace;margin-bottom:8px">PHASE TIMELINE</div>
  <div style="display:flex;gap:5px">${timelineHtml}</div>
</div>

<div style="background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:14px;margin-bottom:14px">
  <div style="font-size:10px;color:${ph.color};letter-spacing:3px;font-family:monospace;margin-bottom:8px">${ph.label} 進捗</div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
    <div class="bebas" style="font-size:26px;color:${ph.color}">${daysLeft}日</div>
    <div style="font-size:11px;color:#555;font-family:monospace">${ph.startDate.replace(/-/g,"/")} 〜 ${ph.endDate.replace(/-/g,"/")}</div>
  </div>
  ${pbar(phPassed,phTotal,ph.color,8)}
  <div style="font-size:10px;color:#555;margin-top:5px;font-family:monospace">フェーズ経過 ${phPct}% — 残り${daysLeft}日</div>
</div>

<div style="font-size:10px;color:#555;letter-spacing:3px;font-family:monospace;margin-bottom:8px">MILESTONES</div>
${msHtml}

<div style="font-size:10px;color:#555;letter-spacing:3px;font-family:monospace;margin:14px 0 8px">
  ${ph.label} カレンダー（${ph.weeks}）
</div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px">
  ${["月","火","水","木","金","土","日"].map(d=>`<div style="text-align:center;font-size:9px;color:#555;padding:4px 0">${d}</div>`).join("")}
</div>
${calHtml}
<div style="text-align:center;padding:20px 0 10px;font-size:11px;color:#333;font-family:monospace">
  🏆 完全復帰目標 2027/01/24
</div>`;
}

// ── MAIN RENDER ────────────────────────────────────────────────────
function renderMain(){
  const sa=document.getElementById("scroll-area");
  const nav=document.getElementById("bottom-nav");

  let content="";
  if(state.tab==="today") content=buildToday();
  else if(state.tab==="week") content=buildWeek();
  else if(state.tab==="logs") content=buildLogs();
  else content=buildCal();

  sa.innerHTML=buildHeader()+`<div style="padding:14px 0">${content}</div>`;
  nav.innerHTML=buildNav();
}

function render(){
  renderMain();
  renderSheet();
}

// ── GLOBAL ACTIONS ─────────────────────────────────────────────────
window.toggle=toggle;
window.setPhase=(id)=>{ state.phase=id; state.openDays=new Set(); render(); };
window.setTab=(t)=>{ state.tab=t; render(); };
window.toggleDay=(dayId)=>{
  const key="__manual__"+dayId;
  const ph=state.phase;
  const todayKey=`p${ph}-${state.todayId}`;
  // First interaction: if it was auto-open today, mark manual
  if(dayId===todayKey&&!state.openDays.has(dayId)&&!state.openDays.has(key)){
    state.openDays.add(key); state.openDays.add(dayId); // will toggle below
  }
  if(state.openDays.has(dayId)) state.openDays.delete(dayId);
  else state.openDays.add(dayId);
  renderMain();
};
window.toggleExpand=(taskId)=>{
  if(state.expandedTasks.has(taskId)) state.expandedTasks.delete(taskId);
  else state.expandedTasks.add(taskId);
  renderMain();
};

// ── INIT ───────────────────────────────────────────────────────────
render();

// PWA install prompt (iOS guidance)
window.addEventListener("appinstalled",()=>console.log("PWA installed!"));
</script>
